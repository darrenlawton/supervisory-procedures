metadata:
  id: customer_service/customer-support-agent
  name: Customer Support Agent
  version: 2.0.0
  schema_version: "2.1"
  business_area: customer_service
  type: standard
  supervisor:
    name: Maria Chen
    email: maria.chen@example.com
    role: Head of Customer Experience
  status: approved
  created_at: "2026-03-11"
  approved_at: "2026-03-11"
  approved_by: customer-experience-governance-board
  authorised_agents:
    - customer-support-agent-prod
    - customer-support-agent-staging

context:
  description: >
    AI-assisted customer service agent for a digital music store. The agent
    classifies each inbound customer request and routes it to one of two
    specialised subgraphs: a lookup subgraph that searches the Chinook music
    catalog for songs, artists, and albums; or a refund subgraph that verifies
    purchase history and processes refunds by removing invoice records from the
    database. Refund deletions require explicit human approval before execution
    and are mocked in test environments (env="test") without modifying data.
  business_rationale: >
    The two-subgraph architecture mirrors the LangSmith evaluate-complex-agent
    pattern: a parent router graph classifies intent and delegates to purpose-
    built subgraphs (lookup, refund). This separation allows each subgraph to
    be evaluated independently — routing accuracy, lookup relevance, and refund
    correctness can each be assessed with dedicated datasets and evaluators.
    Trajectory-based evaluation (correct sequence of tool calls) is supported
    alongside final-response evaluation, enabling partial-credit scoring and
    granular debugging when the agent fails at a specific step.
  applicable_regulations:
    - "UK Consumer Duty (FCA PS22/9) — Customer outcomes and fair treatment"
    - "UK GDPR / Data Protection Act 2018 — Customer data access and retention"
    - "Consumer Rights Act 2015 — Refund and remedy obligations"
    - "FCA DISP — Complaints handling rules"
    - "PCI DSS — Payment card data handling"
    - "Equality Act 2010 — Reasonable adjustments and non-discrimination"
  risk_classification: medium

approved_activities:
  - id: route-request
    description: >
      Classify the customer's inbound message as either a lookup request
      (searching the music catalog for songs, artists, or albums) or a refund
      request (processing a refund on a past purchase). Route to the appropriate
      subgraph.

  - id: lookup-music
    description: >
      Query the Chinook music database to find songs, artists, or albums
      matching the customer's search criteria. Customers may search by artist
      name (e.g. "What songs do you have by Jimi Hendrix?"), album title, or
      track name.

  - id: verify-purchase
    description: >
      Look up the customer's purchase history to locate the specific invoice
      they wish to refund. Confirm the customer's identity and that the invoice
      record exists in the database before proceeding to process-refund. Halt
      with the purchase-not-found vetoed control point if the record cannot be
      verified.

  - id: process-refund
    description: >
      Delete the invoice and associated InvoiceLine records from the Chinook
      database to process the refund. This activity is destructive and
      irreversible — the refund-approval control point (needs_approval) must be
      cleared by a human reviewer before execution. In test environments, pass
      env="test" to mock the deletion without modifying the database.

  - id: generate-response
    description: >
      Compose the final customer-facing response based on the outcome of the
      lookup or refund subgraph. Deliver results clearly and concisely. Passes
      through the response-quality-gate (review) control point before delivery.

constraints:
  procedural_requirements:
    - Classify request intent via route-request before invoking any subgraph activity
    - Always verify the purchase record before processing any refund
    - Obtain explicit human approval (refund-approval) before executing process-refund
    - Pass the generate-response output through response-quality-gate before delivering to the customer
    - Log every step of the interaction trajectory, including routing decisions and control points triggered
    - Use env="test" for all database operations in non-production environments
  unacceptable_actions:
    - Execute process-refund (delete invoice records) without first obtaining explicit human approval via the refund-approval control point
    - Confirm a refund to the customer if the purchase record cannot be verified in the database
    - Access music catalog or purchase data beyond what is required to resolve the current customer request
    - Fabricate song titles, artist names, album titles, or purchase records not present in the Chinook database
    - Share customer purchase history with any channel, tool, or party not listed in the data processing agreement
    - Retain personal data or interaction content beyond the retention period defined in the data governance policy
    - Use demographic characteristics as inputs to routing or resolution decisions

control_points:
  # --- vetoed: agent halts unconditionally, no human override ---

  - id: purchase-not-found
    description: >
      The customer has requested a refund but the specified purchase cannot be
      located in the Chinook database, or the invoice does not match the
      customer's identity. Proceeding with a refund against an unverified
      purchase is prohibited.
    classification: vetoed
    activation: conditional
    trigger: >
      The verify-purchase activity cannot match the customer's stated purchase
      to a Chinook Invoice record, or the InvoiceId found does not belong to
      the identified CustomerId.
    escalation_contact: customer-support-team@example.com

  - id: data-access-scope-breach
    description: >
      The agent has attempted to access or retrieve customer or catalog data
      outside the scope of the current request. Processing must halt and be
      escalated to the Data Protection team.
    classification: vetoed
    activation: conditional
    trigger: >
      An attempted data access operation falls outside the permitted scope for
      the current request: querying a different customer's purchase history,
      accessing prohibited data fields (full payment card numbers, CVV), or
      querying catalog data unrelated to the customer's stated search.
    escalation_contact: data-protection@example.com

  - id: regulated-complaint-detected
    description: >
      The customer's message meets the FCA DISP definition of a regulated
      complaint. Standard support handling must halt and the interaction must
      be routed to the Complaints team.
    classification: vetoed
    activation: conditional
    trigger: >
      The customer's message is an oral or written expression of dissatisfaction
      about the firm's financial services or products where redress or
      remediation is sought, meeting the FCA DISP regulated complaint definition.
    escalation_contact: complaints-team@example.com

  # --- needs_approval: explicit human sign-off required before agent continues ---

  - id: refund-approval
    description: >
      Before the process-refund activity executes any database deletion, the
      refund details (customer name, invoice ID, items, total amount) must be
      presented to the Customer Support Team Leader for explicit approval. The
      refund is applied only after the reviewer confirms.
    classification: needs_approval
    activation: step
    who_reviews: Customer Support Team Leader
    sla_hours: 1

  # --- review: human actively reviews before agent continues ---

  - id: response-quality-gate
    description: >
      Before the final response is delivered to the customer, the draft is
      presented to the human agent for review. The agent checks for accuracy,
      tone, completeness, and compliance with approved communication guidelines.
    classification: review
    activation: step
    who_reviews: Customer Support Agent
    sla_hours: 1

  # --- notify: human is informed but not blocked ---

  - id: model-performance-deviation
    description: >
      When the agent's rolling routing accuracy or customer satisfaction scores
      deviate beyond acceptable bounds, the AI Operations team is notified to
      investigate model drift and initiate retraining if required.
    classification: notify
    activation: conditional
    trigger: >
      Rolling 7-day routing accuracy (correct classification of lookup vs. refund
      intent) drops below 0.85, or average CSAT score for agent-handled
      interactions falls below 3.5 out of 5.0.
    who_reviews: AI Operations Team

workflow:
  steps:
    - activity: route-request

    # Lookup subgraph path
    - id: lookup-music
      activity: lookup-music
      condition: "route == 'lookup'"

    # Refund subgraph path
    - id: verify-purchase
      activity: verify-purchase
      condition: "route == 'refund'"

    - id: process-refund
      activity: process-refund
      condition: "route == 'refund'"
      control_point: refund-approval

    - activity: generate-response
      control_point: response-quality-gate

artifacts:
  resources:
    - file: escalation-contacts.md
      description: >
        Contact directory for specialist teams: Complaints, Data Protection,
        AI Operations, and Customer Support Team Leaders
    - file: regulations.md
      description: >
        Regulatory obligations and agent-specific guidance for Consumer Duty,
        UK GDPR, FCA DISP, Consumer Rights Act, and PCI DSS requirements
    - file: resolution-playbooks.md
      description: >
        Approved resolution playbooks for lookup and refund request types,
        including eligibility criteria, response templates, and escalation paths
  scripts:
    - file: lookup_order.py
      description: >
        Queries the Chinook music database for songs, artists, albums, and
        customer purchase history. Supports env="test" for mock responses
        without database access. Used by the lookup subgraph and the refund
        subgraph's verify-purchase step.
      used_by_activity: lookup-music
    - file: refund_item.py
      description: >
        Processes refunds by deleting Invoice and InvoiceLine records from the
        Chinook database. Supports env="test" to mock deletions without
        modifying data. Must only be invoked after the refund-approval
        control point is cleared by a human reviewer.
      used_by_activity: process-refund
